name: Market Research Agent

on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Queries separated by |'
        required: true
        default: 'وكالات تسويق دبي|شركات أتمتة دبي'
  schedule:
    - cron: '17 6 * * 1-5'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          crawl4ai-setup
      - name: Run researcher
        env:
          QUERY_INPUT: ${{ inputs.queries || 'وكالات تسويق دبي|شركات أتمتة دبي' }}
        run: |
          IFS='|' read -ra QUERIES <<< "$QUERY_INPUT"
          ARGS=()
          for query in "${QUERIES[@]}"; do ARGS+=(--query "$query"); done
          python market_research_agent.py "${ARGS[@]}" --output leads.csv --max-results 5
      - name: Upload leads
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: leads.csv
          retention-days: 14
