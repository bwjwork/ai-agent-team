name: UAE Clinic Prospect Finder

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'نوع العيادة'
        required: true
        default: 'عيادة أسنان'
      cities:
        description: 'المدن مفصولة بـ |'
        required: true
        default: 'دبي|أبوظبي|الشارقة'
      max_results:
        description: 'الحد الأقصى للمصادر لكل مدينة'
        required: true
        default: '10'
      total_limit:
        description: 'العدد الإجمالي المطلوب'
        required: true
        default: '15'
  schedule:
    - cron: '41 6 * * 2'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          crawl4ai-setup
      - name: Discover prospects
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          CATEGORY: ${{ inputs.category || 'عيادة أسنان' }}
          CITIES: ${{ inputs.cities || 'دبي|أبوظبي|الشارقة' }}
          MAX_RESULTS: ${{ inputs.max_results || '10' }}
          TOTAL_LIMIT: ${{ inputs.total_limit || '15' }}
        run: |
          IFS='|' read -ra CITY_LIST <<< "$CITIES"
          ARGS=()
          for city in "${CITY_LIST[@]}"; do ARGS+=(--city "$city"); done
          python clinic_prospect_agent.py "${ARGS[@]}" --category "$CATEGORY" --max-results "$MAX_RESULTS" --total-limit "$TOTAL_LIMIT" --output clinic-prospects.csv
      - name: Upload prospects
        uses: actions/upload-artifact@v4
        with:
          name: clinic-prospects-${{ github.run_number }}
          path: clinic-prospects.csv
          retention-days: 30
